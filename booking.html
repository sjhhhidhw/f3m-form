  <h2>Sign up to book a service</h2>
      <form>
        <label for="name">NAME:</label>
        <input type="text" id="name" required />

        <label for="contact">CONTACT #:</label>
        <input type="tel" id="contact" required />

        <label for="services">SERVICE NEEDED:</label>
        <select id="services" required>
          <option value="" disabled selected>Choose Service</option> <!-- Default option -->
          <option value="cleaning">Cleaning and Maintenance</option>
          <option value="installation">Installation and Relocation</option>
          <option value="repair">Repair Works and Parts Replacement</option>
        </select>

        <label for="message">Additional Details and Concern:</label>
        <textarea id="message"></textarea>

        <button type="submit">SUBMIT</button>
      </form>
    </section>
